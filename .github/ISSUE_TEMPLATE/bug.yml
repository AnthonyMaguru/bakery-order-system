name: Bug
description: Something isn't working
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [mobile, dashboard, backend]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
